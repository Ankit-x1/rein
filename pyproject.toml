[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stars-forecast"
version = "0.1.0"
description = "Dallas Stars 2026-27 regular-season forecasting model (Poisson + Monte Carlo)"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.scripts]
stars-forecast = "stars_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
